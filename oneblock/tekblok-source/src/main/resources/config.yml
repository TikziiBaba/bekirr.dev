# =======================================================
#               TEKBLOK SKYBLOCK EKLENTİSİ
#            Minecraft 1.16.1 - Yapılandırma
# =======================================================

world:
  # Tek Blok adalarının oluşturulacağı dünya adı
  name: "TekBlokWorld"
  gamerules:
    doMobSpawning: true
    doDaylightCycle: true
    doWeatherCycle: false

# =======================================================
#               LOBİ / SPAWN DÜNYASI VE KORUMALARI
# =======================================================
spawn:
  # Lobi dünyası adı
  world: "spawn"
  # Sunucu açılışında spawn dünyasını otomatik yükle
  auto-load-world: true
  # Oyuncu ilk girdiğinde spawn'a ışınla
  first-join-teleport: true
  # Oyuncu her oyuna girdiğinde lobiye ışınlansın mı? (false = adasında kaldığı yerden devam eder)
  join-teleport: false
  # Lobi dünyasında boşluğa (void) düşenleri direkt spawn'a kurtar
  void-protection: true
  void-fall-height: 20
  # Lobi dünyası korumaları (Op olmayanlar için)
  protection:
    disable-pvp: true
    disable-hunger: true
    disable-fall-damage: true
    disable-block-break: true
    disable-block-place: true
  # Ayarlanan spawn noktası (/setspawn veya /spawnset komutu ile güncellenir)
  location:
    set: true
    world: "spawn"
    x: -178.5
    y: 57.0
    z: 249.5
    yaw: 0.0
    pitch: 0.0

island:
  # Adalar arasındaki boşluk mesafesi (blok cinsinden)
  distance-between: 500
  # Tek bloğun Y yüksekliği
  height: 65
  # Tek bloğun hemen altına Bedrock (Katman Kayası) konsun mu? (true = düşmeyi ve kum/çakıl kaymasını önler)
  place-bedrock-underneath: true
  # Kırılan bloklar doğrudan oyuncunun envanterine gelsin mi?
  auto-pickup-drops: true
  # Boşluğa (void) düşen oyuncuyu adasına kurtarma koruması (false: ölsün ve eşyaları gitsin)
  void-protection: false
  # Kurtarmanın tetikleneceği Y koordinatı (Adanın hemen altı)
  void-fall-height: 55
  # Madenlerin %60 daha fazla cikmasi icin carpan
  ore-chance-multiplier: 1.6
  # Canavar cikma oranini dusurme carpani
  mob-chance-multiplier: 0.5

display:
  bossbar:
    enabled: true
    # BossBar başlık formatı
    format: "&6Aşama {phase_id}: {phase_name} &8[&a{broken}&7/&c{required}&8] &8(&e%{percent}&8)"
  actionbar:
    enabled: true
    # Blok kırıldığında gösterilen ActionBar mesajı
    format: "&a+1 Blok &8| &eAşama {phase_id}: {phase_name} &8| &b{broken}&7/&b{required} &8(&e%{percent}&8)"

# Ekonomi Motoru
economy:
  starting-balance: 0.0
  currency-symbol: "₺"

# Ada Çiftçisi ve Satış Fiyatları
